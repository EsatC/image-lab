services:
  backend:
    build: ./backend
    container_name: imagelab-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/instance

  frontend:
    build: ./frontend
    container_name: imagelab-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  uploads_data:
  db_data:
